[project]
name = "patine"
version = "0.1.0"
description = "Patine sidecar: library database, analysis pipeline, conform renderer, render cache and export."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "librosa>=0.10,<2",
  "soundfile>=0.12",
  "soxr>=0.4",
  "pyloudnorm>=0.1.1",
  "python-stretch>=0.3.1",
  "mido>=1.3",
]

[project.optional-dependencies]
# Learned models. Heavy (pulls torch); installed on demand, weights fetched on first run.
ml = [
  "torch>=2.2",
  "beat_this>=1.1",
  "demucs>=4.0",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyinstaller>=6.10",
]

[project.scripts]
patine-sidecar = "patine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
